database:
  url_env_var: DATABASE_URL   # actual URL comes from env; this just documents the var name

tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL

sources:
  news:
    enabled: true
  edgar:
    enabled: true
    forms: ["8-K", "10-Q"]
  transcript:
    enabled: true
    note: "Reads config/sample_transcripts/<TICKER>.json — hand-collected sample, not a live feed."

model:
  name: claude-sonnet-4-6
  extractor_max_tokens: 1024
  critic_max_tokens: 512

signal:
  rolling_window_days: 20
  source_weights:
    edgar: 1.2
    transcript: 1.0
    news: 0.8

backtest:
  decile_split: 10        # use top/bottom 1/10th when universe is large enough
  min_universe_for_decile: 10
  sweep:
    decay_rates: [0.8, 0.9, 0.95]
    window_days_options: [10, 20, 40]

evaluation:
  golden_set_path: config/golden_set.csv
